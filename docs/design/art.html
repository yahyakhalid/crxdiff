<!doctype html>
<!--
  Source for the README banners, the social preview and the Chrome Web Store promo
  images. Rendered by scripts/render-art.mjs over a local HTTP server:
    art.html?kind=banner|store-popup|tile|marquee&lang=en|ar
  The images inside are real screenshots of the extension (docs/images/*), taken with
  scripts/screenshots.mjs on simulated data.
-->
<html>
<head>
<meta charset="utf-8">
<title>crxdiff art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17213b;
    --ink-2: #223056;
    --paper: #f3f4ef;
    --marker: #ffd43b;
    --high: #c8372d;
    --muted: #b9c2d8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { overflow: hidden; }
  body { background: var(--ink); color: var(--paper); font-family: 'IBM Plex Sans', sans-serif; }
  [lang="ar"] body, body:lang(ar) { font-family: 'IBM Plex Sans Arabic', sans-serif; }
  .mark { background: linear-gradient(100deg, transparent 0 3px, var(--marker) 3px calc(100% - 4px), transparent calc(100% - 4px)) 0 70% / 100% 60% no-repeat; color: var(--ink); padding: 0 6px; }
  .word { font: 700 1em/1 'IBM Plex Mono', monospace; letter-spacing: -0.03em; display: inline-flex; align-items: center; gap: 0.35em; }
  .word img { width: 1.1em; height: 1.1em; }
  .shot { display: block; border-radius: 14px; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45), 0 0 0 1.5px rgba(255, 255, 255, 0.08); }
  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 32px 32px; }
  .kicker { font: 600 15px/1.3 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--marker); }
  :lang(ar) .kicker { font-family: 'IBM Plex Sans Arabic', sans-serif; letter-spacing: 0; text-transform: none; font-size: 18px; }
  .sub { color: var(--muted); }

  /* banner 1280x640 */
  .banner { display: grid; grid-template-columns: 520px 1fr; gap: 40px; align-items: center; padding: 0 0 0 64px; }
  :lang(ar) .banner { padding: 0 64px 0 0; }
  .banner .word { font-size: 64px; }
  .banner h1 { font-size: 38px; line-height: 1.22; margin: 26px 0 16px; font-weight: 700; }
  :lang(ar) .banner h1 { font-size: 40px; line-height: 1.5; }
  .banner .sub { font-size: 19px; line-height: 1.5; max-width: 470px; }
  :lang(ar) .banner .sub { font-size: 20px; line-height: 1.75; }
  .banner .crop { width: 760px; height: 560px; overflow: hidden; border-radius: 14px; }
  .banner .crop .shot { width: 1000px; margin: -96px 0 0 -84px; }
  :lang(ar) .banner .crop .shot { margin: -96px 0 0 -170px; }

  /* store screenshot 1280x800 with the popup */
  .spop { display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center; padding: 0 80px; }
  .spop h1 { font-size: 50px; line-height: 1.15; margin: 18px 0 20px; }
  :lang(ar) .spop h1 { font-size: 50px; line-height: 1.45; }
  .spop .sub { font-size: 22px; line-height: 1.55; max-width: 560px; }
  :lang(ar) .spop .sub { line-height: 1.8; }
  .spop .points { margin-top: 26px; display: grid; gap: 10px; font-size: 19px; }
  .spop .points span::before { content: '▲ '; color: var(--marker); font-size: 14px; }
  .spop .shot { width: 430px; }

  /* small promo tile 440x280 */
  .tile { display: flex; flex-direction: column; justify-content: center; padding: 0 34px; }
  .tile .word { font-size: 38px; }
  .tile p { font-size: 25px; line-height: 1.3; font-weight: 700; margin-top: 18px; }
  :lang(ar) .tile p { font-size: 25px; line-height: 1.6; }
  .tile .sub { font-size: 14.5px; font-weight: 400; margin-top: 10px; line-height: 1.45; }

  /* marquee 1400x560 */
  .marq { display: grid; grid-template-columns: 560px 1fr; gap: 40px; align-items: center; padding: 0 0 0 70px; }
  :lang(ar) .marq { padding: 0 70px 0 0; }
  .marq .word { font-size: 46px; }
  .marq h1 { font-size: 44px; line-height: 1.2; margin: 22px 0 14px; }
  :lang(ar) .marq h1 { line-height: 1.5; }
  .marq .sub { font-size: 20px; line-height: 1.5; }
  .marq .crop { width: 760px; height: 470px; overflow: hidden; border-radius: 14px; }
  .marq .crop .shot { width: 980px; margin: -90px 0 0 -82px; }
  :lang(ar) .marq .crop .shot { margin: -90px 0 0 -110px; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="grid-bg"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const kind = q.get('kind') || 'banner';
  const ar = q.get('lang') === 'ar';
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir = ar ? 'rtl' : 'ltr';
  const L = ar ? 'ar' : 'en';
  const T = {
    en: {
      kicker: 'Chrome extension · local only',
      h1: 'What changed in your <span class="mark">extension update</span>?',
      sub: 'Chrome installs extension updates silently. crxdiff compares each new version with the last one and explains new permissions, new sites and risky code.',
      popH1: 'Every update, <span class="mark">explained</span>',
      popSub: 'A badge when an update deserves a look, and a plain-language report for each one.',
      p1: 'New permissions, even the ones Chrome never warns about',
      p2: 'New sites in the code, removed security headers, eval and remote scripts',
      p3: 'Optional: turn off an extension whose update is high risk',
      tile: 'What changed in your <span class="mark">extensions</span>?',
      tileSub: 'Update reports, computed on your device.',
      mh1: 'Silent updates, <span class="mark">made visible</span>',
      msub: 'Permissions, sites, code patterns and files, compared on your device. No server, no tracking.',
    },
    ar: {
      kicker: 'إضافة لكروم · تعمل على جهازك فقط',
      h1: 'ماذا تغيّر في <span class="mark">تحديث إضافتك</span>؟',
      sub: 'كروم يثبّت تحديثات الإضافات بصمت. يقارن crxdiff كل نسخة جديدة بالتي قبلها ويشرح الصلاحيات الجديدة والمواقع الجديدة والكود الخطِر.',
      popH1: 'كل تحديث <span class="mark">مشروح</span>',
      popSub: 'شارة حين يستحق تحديثٌ نظرة، وتقرير بلغة واضحة لكل تحديث.',
      p1: 'الصلاحيات الجديدة، حتى التي لا يحذّر منها كروم',
      p2: 'مواقع جديدة في الكود، وحذف ترويسات الأمان، واستخدام eval والسكربتات البعيدة',
      p3: 'اختياري: أوقف الإضافة إذا كان تحديثها عالي الخطورة',
      tile: 'ماذا تغيّر في <span class="mark">إضافاتك</span>؟',
      tileSub: 'تقارير التحديثات تُحسب على جهازك.',
      mh1: 'تحديثات صامتة <span class="mark">صارت مرئية</span>',
      msub: 'الصلاحيات والمواقع وأنماط الكود والملفات، تُقارن على جهازك. بلا خادم ولا تتبّع.',
    },
  }[L];
  const word = '<span class="word" dir="ltr"><img src="icon.svg" alt="">crxdiff</span>';
  const html = {
    banner: `<div class="stage banner"><div class="grid-bg"></div><div style="position:relative">${word}<h1>${T.h1}</h1><p class="sub">${T.sub}</p></div><div class="crop" style="position:relative"><img class="shot" src="../images/report-${L}.png" alt=""></div></div>`,
    'store-popup': `<div class="stage spop"><div class="grid-bg"></div><div style="position:relative"><p class="kicker">${T.kicker}</p><h1>${T.popH1}</h1><p class="sub">${T.popSub}</p><div class="points"><span>${T.p1}</span><span>${T.p2}</span><span>${T.p3}</span></div></div><img class="shot" style="position:relative" src="../images/popup-${L}.png" alt=""></div>`,
    tile: `<div class="stage tile"><div class="grid-bg"></div><div style="position:relative">${word}<p>${T.tile}</p><p class="sub">${T.tileSub}</p></div></div>`,
    marquee: `<div class="stage marq"><div class="grid-bg"></div><div style="position:relative">${word}<h1>${T.mh1}</h1><p class="sub">${T.msub}</p></div><div class="crop" style="position:relative"><img class="shot" src="../images/report-${L}.png" alt=""></div></div>`,
  }[kind];
  document.getElementById('stage').outerHTML = html;
</script>
</body>
</html>
